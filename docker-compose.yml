# Development and tests. Operation gets its own setup (#10).
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 15

  web:
    build:
      context: .
      target: dev
    env_file: .env
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # Voice agent (#13) with a LiveKit server for development. Profile
  # `voice`, so `docker compose up` still starts only the website.
  livekit:
    image: livekit/livekit-server:v1.13.7
    profiles: [voice]
    command: --dev --bind 0.0.0.0 --node-ip 127.0.0.1
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"

  voice:
    build:
      context: ./voice
      target: dev
    profiles: [voice]
    env_file: .env
    volumes:
      - ./voice:/app
    depends_on:
      - livekit

volumes:
  pgdata:
