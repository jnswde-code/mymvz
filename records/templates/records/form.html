{% extends "base.html" %}

{% block title %}{{ title }} – MyMVZ Grevenbroich{% endblock %}

{% block content %}
  {% include "records/_header.html" %}

  <h2>{{ title }}</h2>
  {% if record %}<p>{% include "records/_record.html" %}</p>{% endif %}
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">{{ submit }}</button>
  </form>
  <p><a href="{{ back }}">Abbrechen</a></p>
{% endblock %}
