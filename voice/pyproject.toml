# Only pytest: ruff runs from the repo root over the whole repo, including
# this directory (`pyproject.toml` there).
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "--strict-markers --cov --cov-report=term-missing:skip-covered"

[tool.coverage.run]
branch = true
source = ["mymvz_voice"]
# Outside the repo: the code is mounted into the container as a volume.
data_file = "/tmp/.coverage"
