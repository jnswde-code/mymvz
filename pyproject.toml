[project]
name = "mymvz"
version = "0.1.0"
requires-python = ">=3.13"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["claude-arbeitsweise"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ"]
