[project]
name = "mymvz"
version = "0.1.0"
requires-python = ">=3.13"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
# Branch coverage is shown, never enforced (.claude/rules/tests.md, #22).
addopts = "--strict-markers --cov --cov-report=term-missing:skip-covered"

[tool.coverage.run]
branch = true
source = ["."]
omit = ["tests/*", "*/tests/*", "*/migrations/*", "claude-arbeitsweise/*", "manage.py"]
# Outside the repo: the code is mounted into the container as a volume.
data_file = "/tmp/.coverage"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["claude-arbeitsweise"]
# The voice agent (#13) is its own package under voice/.
src = [".", "voice"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ"]
